<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Danya Musbah, Software Engineer">
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#efe6d5" opacity=".10"/></pattern>
  <radialGradient id="glow" cx="80%" cy="50%" r="55%"><stop offset="0" stop-color="#ff6f59" stop-opacity=".24"/><stop offset="1" stop-color="#ff6f59" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1000" height="320" rx="18" fill="#0e0f13"/>
<rect width="1000" height="320" rx="18" fill="url(#dots)"/>
<rect width="1000" height="320" rx="18" fill="url(#glow)"/>
<rect x="14" y="14" width="972" height="292" rx="12" fill="none" stroke="#efe6d5" stroke-opacity=".12"/>

<!-- orbit -->
<g stroke="#efe6d5" stroke-opacity=".10"><line x1="650" y1="160" x2="950" y2="160"/><line x1="800" y1="30" x2="800" y2="290"/></g>
<circle cx="800" cy="160" r="125" fill="none" stroke="#efe6d5" stroke-opacity=".16"/>
<circle cx="800" cy="160" r="88" fill="none" stroke="#ff6f59" stroke-opacity=".45" stroke-dasharray="1 9" stroke-linecap="round" stroke-width="2"/>
<circle cx="800" cy="160" r="50" fill="none" stroke="#8fbf9f" stroke-opacity=".55" stroke-dasharray="2 7"/>
<g><circle cx="925" cy="160" r="4" fill="#efe6d5"/><circle cx="675" cy="160" r="2.5" fill="#efe6d5" opacity=".6"/>
  <animateTransform attributeName="transform" type="rotate" from="0 800 160" to="360 800 160" dur="48s" repeatCount="indefinite"/></g>
<g><circle cx="888" cy="160" r="5" fill="#ff6f59"/><circle cx="738" cy="222" r="2.5" fill="#ff6f59" opacity=".7"/>
  <animateTransform attributeName="transform" type="rotate" from="360 800 160" to="0 800 160" dur="28s" repeatCount="indefinite"/></g>
<g><circle cx="750" cy="160" r="3.5" fill="#8fbf9f"/>
  <animateTransform attributeName="transform" type="rotate" from="0 800 160" to="360 800 160" dur="14s" repeatCount="indefinite"/></g>
<circle cx="800" cy="160" r="7" fill="#ff6f59"><animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite"/></circle>

<!-- text -->
<text x="50" y="66" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="4" fill="#ff6f59">SOFTWARE ENGINEERING GRADUATE</text>
<text x="46" y="156" font-family="Georgia, 'Times New Roman', serif" font-size="88" fill="#efe6d5">Danya</text>
<text x="46" y="238" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-style="italic" fill="#ff6f59">Musbah</text>
<text x="50" y="286" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#ff6f59">&gt;</text>
  <text x="74" y="286" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#efe6d5" opacity="1">Full-Stack Development &amp; REST APIs
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0333;0.1667;0.2000;1" dur="15s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="74" y="286" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#efe6d5" opacity="0">Data Analytics &amp; Data Science
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0333;0.1667;0.2000;1" dur="15s" begin="3s" repeatCount="indefinite"/>
  </text>
  <text x="74" y="286" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#efe6d5" opacity="0">Machine Learning &amp; NLP
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0333;0.1667;0.2000;1" dur="15s" begin="6s" repeatCount="indefinite"/>
  </text>
  <text x="74" y="286" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#efe6d5" opacity="0">Python &amp; intelligent applications
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0333;0.1667;0.2000;1" dur="15s" begin="9s" repeatCount="indefinite"/>
  </text>
  <text x="74" y="286" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#efe6d5" opacity="0">Databases, backend systems &amp; architecture
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0333;0.1667;0.2000;1" dur="15s" begin="12s" repeatCount="indefinite"/>
  </text>
</svg>